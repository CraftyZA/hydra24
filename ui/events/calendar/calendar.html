<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Calendar - Hydra 24</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/common/icon.js"></script>
  <script src="/common/config.js"></script>
  <script src="/common/auth-config.js"></script>
  <script src="/common/auth.js"></script>
  <script src="/common/dom.js"></script>
  <script src="/common/api.js"></script>
  <script src="/common/format.js"></script>
  <script src="/common/form.js"></script>
  <script src="/common/paged-list.js"></script>
</head>
<body>
  <script src="/common/titlebar.js"></script>

  <main class="page content-page">
    <div class="page-heading">
      <h1>Calendar</h1>
    </div>
    <div class="filters">
      <label class="field">Event type
        <select id="type-filter"></select>
      </label>
      <label class="field">When
        <select id="when-filter">
          <option value="upcoming">Upcoming</option>
          <option value="past">Past</option>
        </select>
      </label>
    </div>
    <p class="status" id="status" role="status" hidden></p>
    <div class="paged-list" id="events"></div>

    <footer class="page-footer">
      <script src="/common/backbutton.js"></script>
      <script src="/common/carousel.js"></script>
    </footer>
  </main>
  <script src="/events/calendar/calendar.js"></script>
</body>
</html>
