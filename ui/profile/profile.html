<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Profile - Hydra 24</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/common/icon.js"></script>
  <script src="/common/config.js"></script>
  <script src="/common/auth-config.js"></script>
  <script src="/common/auth.js"></script>
  <script src="/common/dom.js"></script>
  <script src="/common/api.js"></script>
  <script src="/common/form.js"></script>
  <script src="/common/profile-form.js"></script>
</head>
<body>
  <script src="/common/titlebar.js"></script>

  <main class="page content-page">
    <div class="page-heading">
      <h1>My profile</h1>
      <a class="page-link" href="/profile/entries.html">My entries</a>
    </div>
    <p class="status" id="status" role="status" hidden></p>

    <form class="form" id="profile-form" hidden>
      <span class="step-progress" data-step-progress></span>

      <div class="form-buttons">
        <button class="btn btn-secondary" type="button" data-step-back>Back</button>
        <button class="btn" type="button" data-step-next>Next</button>
        <button class="btn" type="submit">Save</button>
      </div>
    </form>

    <footer class="page-footer">
      <script src="/common/backbutton.js"></script>
      <script src="/common/carousel.js"></script>
    </footer>
  </main>
  <script src="/profile/profile.js"></script>
</body>
</html>
