# Everything comes from the Lambda environment (iac/backend.tf).

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
# Lambda serves one request at a time.
quarkus.datasource.jdbc.max-size=2

quarkus.flyway.migrate-at-start=true

auth.jwt.issuer=${AUTH_JWT_ISSUER}
auth.jwt.audience=${AUTH_JWT_AUDIENCE}
auth.jwt.keys=${AUTH_JWT_KEYS}

# Leave heap room in the 256 MB Lambda for native overhead.
quarkus.native.additional-build-args=-R:MaxHeapSize=180m
